services:
  - type: web
    name: immutrack-nashik
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn immutrack.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: immutrack-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: ""

databases:
  - name: immutrack-db
    plan: free
